name: Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Read APK version
        id: apk-version
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const metadata = JSON.parse(fs.readFileSync('android/app/build/outputs/apk/release/output-metadata.json', 'utf8'));
          const element = metadata.elements?.find((item) => item?.outputFile === 'app-release.apk') || metadata.elements?.[0];
          if (!element?.versionName || !Number.isInteger(element.versionCode)) {
            throw new Error('Release APK metadata is missing versionName/versionCode.');
          }
          console.log(`version_name=${element.versionName}`);
          console.log(`version_code=${element.versionCode}`);
          console.log(`tag=v${element.versionName}`);
          NODE

      - name: Prepare release artifacts
        env:
          VERSION_NAME: ${{ steps.apk-version.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk-version.outputs.version_code }}
          TAG: ${{ steps.apk-version.outputs.tag }}
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/thodenngay.apk
          cat > artifacts/latest.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "releaseNotes": "Cải thiện giao diện và độ ổn định",
            "apkUrl": "https://github.com/hoaitv86/thodenngay/releases/download/${TAG}/thodenngay.apk"
          }
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: thodenngay-apk-v${{ steps.apk-version.outputs.version_name }}-${{ steps.apk-version.outputs.version_code }}
          path: |
            artifacts/thodenngay.apk
            artifacts/latest.json
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk-version.outputs.tag }}
          VERSION_NAME: ${{ steps.apk-version.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk-version.outputs.version_code }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Thợ Đến Ngay ${VERSION_NAME}" \
              --notes "Android APK v${VERSION_NAME} (${VERSION_CODE})." \
              --latest
          else
            gh release create "$TAG" \
              --title "Thợ Đến Ngay ${VERSION_NAME}" \
              --notes "Android APK v${VERSION_NAME} (${VERSION_CODE})." \
              --latest
          fi

          gh release upload "$TAG" artifacts/thodenngay.apk artifacts/latest.json --clobber
